# codemagic.yaml —— 「掌上唐师」iOS 原生版云编译出包
#
# 为什么用 Codemagic 而不是 GitHub Actions：
#   GitHub 账号当前因计费问题被锁，所有 Actions 作业都无法启动
#   （历史每次 run 都是 4 秒失败："The job was not started because your
#    account is locked due to a billing issue"）。
#   Codemagic 免费额度（mac_mini_m2）自带 Xcode 26 / iOS 26 SDK，能正常跑。
#
# 为什么必须 Xcode 26：
#   ios-native/Sources/Design/Glass.swift 在 `if #available(iOS 26.0, *)` 分支里用了
#   glassEffect / Glass / GlassEffectContainer 等 iOS 26 SDK 专有 API。
#   运行期 iOS 17–25 会自动回退到 .ultraThinMaterial，
#   但编译期必须挂 iOS 26 SDK（Xcode 16 会报「找不到 Glass」）。
#
# 产物：zstangshi-ios-unsigned.ipa（未签名），
#       用 Sideloadly / AltStore 以自己的 Apple ID 重签安装（免费账号 7 天）。

workflows:
  ios-ipa:
    name: 掌上唐师 iOS 原生版 · 出 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 本文件在**仓库根**，工程在 ios-native/
    working_directory: ios-native

    environment:
      xcode: latest
      vars:
        SCHEME: ZhangShangTangShi

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: 校验 Xcode / iOS SDK
        script: |
          set -e
          echo "Working dir: $(pwd)"
          echo "Xcode: $(xcodebuild -version | head -1)"
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK"
          if [[ "$SDK" != 26.* ]]; then
            echo "本工程用到 iOS 26 的 glassEffect / Glass，需要 Xcode 26（当前 SDK=$SDK）"
            exit 1
          fi

      - name: 安装 XcodeGen
        script: |
          set -e
          which xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen version

      - name: 生成 Xcode 工程
        script: |
          set -e
          xcodegen generate
          ls -la
          xcodebuild -list -project "${SCHEME}.xcodeproj"

      # 注意：`xcodebuild ... | tee build.log` 的退出码是 tee 的（恒为 0），
      # 会把编译失败吞掉、后面照样"成功"打出一个空 ipa。
      # 所以这里用 PIPESTATUS 取 xcodebuild 的真实退出码。
      - name: 编译
        script: |
          set -o pipefail
          xcodebuild \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -120
          status=${PIPESTATUS[0]}
          echo "xcodebuild exit = $status"
          if [ "$status" -ne 0 ]; then
            echo "===== compile errors ====="
            grep -E "error:" build.log | sort -u | head -60 || true
            exit "$status"
          fi
          ls -d build/Build/Products/Release-iphoneos/*.app >/dev/null 2>&1 || {
            echo "编译报告成功但没有 .app 产物"
            exit 1
          }

      - name: 打包未签名 IPA
        script: |
          set -e
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "app: $APP"
          du -sh "$APP"

          if [ -d "$APP/PlugIns/TodayWidget.appex" ]; then
            echo "TodayWidget.appex embedded"
          else
            echo "ERROR: TodayWidget.appex missing, widget not built"
            ls -R "$APP/PlugIns" 2>/dev/null || true
            exit 1
          fi

          # 网页套壳版：www/ 静态资源由 XcodeGen 打平会重名冲突，
          # 这里手动把整个 www 目录（保留子目录）塞进 app bundle。
          if [ -d "Resources/www" ]; then
            rm -rf "$APP/www"
            cp -R Resources/www "$APP/www"
            echo "www/ -> app bundle:"
            find "$APP/www" -type f | wc -l | xargs echo "  files:"
            du -sh "$APP/www"
          else
            echo "ERROR: Resources/www 不存在"
            exit 1
          fi

          rm -rf Payload zstangshi-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          find Payload -name _CodeSignature -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find Payload -name "*.mobileprovision" -delete 2>/dev/null || true
          zip -qry zstangshi-ios-unsigned.ipa Payload
          ls -lh zstangshi-ios-unsigned.ipa
          shasum -a 256 zstangshi-ios-unsigned.ipa

          SIZE=$(stat -f%z zstangshi-ios-unsigned.ipa)
          echo "ipa size = $SIZE bytes"
          if [ "$SIZE" -lt 600000 ]; then
            echo "ERROR: ipa too small ($SIZE bytes)"
            exit 1
          fi

    # artifacts 路径相对 working_directory（ios-native/）解析，
    # 所以不能带 ios-native/ 前缀（带了会导致 artefacts 为空）。
    artifacts:
      - zstangshi-ios-unsigned.ipa
      - build.log

    publishing:
      email:
        recipients:
          - chenmingfei20050717@foxmail.com
        notify:
          success: true
          failure: true
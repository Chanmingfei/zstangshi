# project.yml —— 可选：用 XcodeGen 重新生成 .xcodeproj
#
# 仓库里提交的 ZhangShangTangShi.xcodeproj/project.pbxproj 是**权威**且可直接打开，
# 这个文件只是给「更习惯声明式工程描述」的人一个等价入口：
#   brew install xcodegen && cd ios && xcodegen generate
#
# 注意：xcodegen 会覆盖 .xcodeproj。如果你用 xcodegen 生成，请把生成的
# project.pbxproj 一并提交，别让两种来源长期并存（结构改动两边会漂移）。

name: ZhangShangTangShi

options:
  bundleIdPrefix: com.tstc
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  ZhangShangTangShi:
    type: application
    platform: iOS
    sources:
      - path: ZhangShangTangShi/App
      - path: ZhangShangTangShi/Web
      - path: ZhangShangTangShi/Bridge
      - path: ZhangShangTangShi/Resources/Assets.xcassets
      # folder = 文件夹引用（Blue folder），整个目录原样拷进 bundle，保留内部结构
      - path: ZhangShangTangShi/Resources/www
        type: folder
    settings:
      base:
        # Info.plist 由仓库维护，不要让 xcodegen 重新生成
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ZhangShangTangShi/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tstc.zstangshi
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    scheme:
      testTargets: []
      gatherCoverageData: false

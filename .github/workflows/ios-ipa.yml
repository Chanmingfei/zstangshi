# 在 GitHub 的 macOS runner 上编译 iOS 包。
#
# 为什么需要它：打 .ipa 必须有 Apple 的 iOS SDK，而 SDK 只能装在 macOS 上。
# 手边没有 Mac 时，这是唯一「全自动拿到 .ipa 文件」的途径 ——
# 推到 GitHub 后点一下 Run workflow，几分钟后从 Actions 页面下载产物。
#
# 产物是**未签名** ipa：先下载，再用 Sideloadly / AltStore 以你自己的 Apple ID 重签安装。
# 若要出可直接分发的签名包，见文件末尾注释掉的 signed 任务（需要配置 Secrets）。

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要编译的分支或 tag（留空 = 当前分支）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  unsigned-ipa:
    name: 编译未签名 ipa
    # 注意：本账号下 macos-14 会报 "The configuration 'macos-14-arm64-us-default' is not supported"，
    # 用 macos-15。它会给出 Xcode 16 与 iOS 18 SDK，本工程 objectVersion 56 可直接打开。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          node --version

      - name: 同步 H5 资源（web/ 是唯一真源）
        run: bash ios/scripts/sync-web.sh

      - name: 校验工程结构
        run: node ios/scripts/verify-project.mjs

      - name: 桥协议一致性测试
        run: node ios/scripts/test-bridge.mjs

      - name: 渲染冒烟（失败不阻塞出包）
        continue-on-error: true
        run: node ios/scripts/test-shell-smoke.mjs

      - name: 编译并打包 ipa
        run: bash ios/scripts/build-ipa.sh --output "$RUNNER_TEMP/out"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ZhangShangTangShi-unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 30


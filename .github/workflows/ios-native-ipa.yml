# 在 GitHub 的 macOS runner 上编译 ios-native（SwiftUI 原生版 v4.0.0）。
#
# 为什么必须 macos-26 / Xcode 26：
#   v4 的 Sources/Design/Glass.swift 在 `if #available(iOS 26.0, *)` 分支里用到
#   glassEffect / Glass / GlassEffectContainer 等 **iOS 26 SDK 专有 API** ——
#   只有 Xcode 26（iOS 26 SDK）能编译，Xcode 16 / iOS 18 SDK 会直接报「找不到 Glass」。
#   运行期 iOS 17–25 会自动回退到 .ultraThinMaterial，但**编译期必须挂 iOS 26 SDK**。
#   GitHub 的 macos-26 runner 预装 Xcode 26 GA；macos-15 只有 Xcode 16，故不能用。
#
# 打 .ipa 必须有 Apple 的 iOS SDK，而 SDK 只能装在 macOS 上。手边没有 Mac 时，
# 这是全自动拿到 ipa 的途径。产物是**未签名** ipa：下载后用 Sideloadly / AltStore
# 以自己的 Apple ID 重签安装（免费账号 7 天有效期）。
#
# 只做手动触发（workflow_dispatch）。tag `v*` 触发的出包走另一个旧 workflow
# `.github/workflows/ios-ipa.yml`（v2 WKWebView 套壳版），与本文件无关，不要动它。

name: Build iOS Native IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '编译配置（Debug / Release）'
        required: false
        default: 'Release'

jobs:
  unsigned-ipa:
    name: 编译未签名 ipa（SwiftUI 原生版 v4.0.0）
    # 必须是 macos-26：只有它带 Xcode 26 / iOS 26 SDK（见文件头注释）。
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 26 / 校验 iOS 26 SDK
        run: |
          set -euo pipefail
          # macos-26 镜像默认即 Xcode 26；若镜像里并存多个 Xcode，显式挑 26.x。
          # 用 glob 循环而非写死路径，避免 /Applications/Xcode_26.1.app 这种版本号差异。
          for app in /Applications/Xcode_26*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          echo "Developer dir: $(xcode-select -p)"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK"
          if [[ "$SDK" != 26.* ]]; then
            echo "::error::本工程用到 iOS 26 的 glassEffect / Glass 等 API，需 Xcode 26 (iOS 26 SDK)，当前 SDK=$SDK"
            exit 1
          fi
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios-native
        run: xcodegen generate

      - name: 编译
        working-directory: ios-native
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          # 编译主 App scheme 会连 TodayWidgetExtension 一起构建并嵌入 .app/PlugIns。
          # 未签名构建：CODE_SIGNING_ALLOWED=NO 会一并跳过 .appex 的 Code Sign On Copy。
          xcodebuild \
            -project ZhangShangTangShi.xcodeproj \
            -scheme ZhangShangTangShi \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -40

      - name: 打包成 ipa
        working-directory: ios-native
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/${CONFIG}-iphoneos"
          APP=$(ls -d "$APP_DIR"/*.app | head -1)
          echo "app: $APP"
          rm -rf Payload out.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 去掉所有本机签名残留（含嵌套 .appex 里的），否则 Sideloadly 重签会报 bundle 已被修改
          find Payload -name _CodeSignature -type d -prune -exec rm -rf {} + 2>/dev/null || true
          zip -qry out.ipa Payload
          ls -la out.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zstangshi-ios-unsigned
          path: ios-native/out.ipa
          if-no-files-found: error

      - name: 失败时打印编译错误
        if: failure()
        run: |
          grep -E "error:|note: .*error" ios-native/build.log | head -60 || tail -80 ios-native/build.log

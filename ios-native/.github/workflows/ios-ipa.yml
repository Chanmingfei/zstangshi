# 在 GitHub 的 macOS runner 上编译「掌上唐师」iOS 原生版并产出未签名 IPA。
#
# 为什么必须 macos-26 / Xcode 26：
#   Sources/Design/Glass.swift 在 `if #available(iOS 26.0, *)` 分支里用了
#   glassEffect / Glass / GlassEffectContainer 等 **iOS 26 SDK 专有 API**。
#   运行期 iOS 17–25 会自动回退到 .ultraThinMaterial，但**编译期必须挂 iOS 26 SDK**，
#   Xcode 16（iOS 18 SDK）会直接报「找不到 Glass」。
#
# 产物是**未签名** ipa：下载后用 Sideloadly / AltStore 以自己的 Apple ID 重签安装
# （免费账号 7 天有效期，开发者账号 1 年）。
#
# 用法：
#   1. 把 zstangshi-ios/ 提交到你的 GitHub 仓库（放在仓库根或子目录都行，
#      下面的 paths 与 working-directory 默认按「仓库根 = zstangshi-ios/」写；
#      若放在子目录，改 working-directory 与 artifact path 即可）；
#   2. 仓库 → Actions → 「Build iOS IPA」→ Run workflow；
#   3. 跑完后在本次 run 的 Artifacts 里下载 zstangshi-ios-unsigned。

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '编译配置（Release / Debug）'
        required: false
        default: 'Release'
  push:
    tags:
      - 'v*'

jobs:
  unsigned-ipa:
    name: 编译未签名 IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 1. 选 Xcode 26 / 校验 iOS 26 SDK ────────────────────────────────
      - name: 选择 Xcode 26 并校验 SDK
        run: |
          set -euo pipefail
          # macos-26 默认即 Xcode 26；若镜像里并存多个 Xcode，显式挑 26.x。
          # 用 glob 循环而非写死路径，避免 Xcode_26.1.app 这种版本号差异。
          if ls -d /Applications/Xcode_26*.app >/dev/null 2>&1; then
            for app in /Applications/Xcode_26*.app; do
              if [ -d "$app" ]; then
                sudo xcode-select -s "$app/Contents/Developer"
                break
              fi
            done
          fi
          echo "Developer dir: $(xcode-select -p)"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK"
          if [[ "$SDK" != 26.* ]]; then
            echo "::error::本工程用到 iOS 26 的 glassEffect / Glass 等 API，需要 Xcode 26 (iOS 26 SDK)，当前 SDK=$SDK"
            echo "::error::请确认 runner 为 macos-26；若镜像是 macos-15（Xcode 16），请改回 macos-26。"
            exit 1
          fi

      # ── 2. 安装 XcodeGen 并生成工程 ────────────────────────────────────
      - name: 安装 XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la
          # 打印 target 列表，便于确认主 App 与 Widget 都被识别
          xcodebuild -list -project ZhangShangTangShi.xcodeproj

      # ── 3. 编译（未签名）────────────────────────────────────────────────
      - name: 编译
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          # 编译主 App scheme 会连 TodayWidgetExtension 一起构建并嵌入 .app/PlugIns。
          # 未签名构建：CODE_SIGNING_ALLOWED=NO 会一并跳过 .appex 的 Code Sign On Copy。
          xcodebuild \
            -project ZhangShangTangShi.xcodeproj \
            -scheme ZhangShangTangShi \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -60

      # ── 4. 打包成 ipa ──────────────────────────────────────────────────
      - name: 打包成 ipa
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/${CONFIG}-iphoneos"
          APP=$(ls -d "$APP_DIR"/*.app | head -1)
          echo "app: $APP"

          # 校验：小组件确实被嵌进去了（没有的话桌面小组件不工作）
          if [ -d "$APP/PlugIns/TodayWidget.appex" ]; then
            echo "✅ TodayWidget.appex 已嵌入"
          else
            echo "::warning::没有找到 PlugIns/TodayWidget.appex，小组件可能未被构建"
            ls -R "$APP/PlugIns" 2>/dev/null || true
          fi

          rm -rf Payload zstangshi-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 去掉本机签名残留（含嵌套 .appex），否则 Sideloadly 重签会报「bundle 已被修改」
          find Payload -name _CodeSignature -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find Payload -name "*.mobileprovision" -delete 2>/dev/null || true
          zip -qry zstangshi-ios-unsigned.ipa Payload
          ls -lh zstangshi-ios-unsigned.ipa
          echo "SHA256: $(shasum -a 256 zstangshi-ios-unsigned.ipa | awk '{print $1}')"

      # ── 5. 上传 ────────────────────────────────────────────────────────
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: zstangshi-ios-unsigned
          path: zstangshi-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 失败时打印编译错误
        if: failure()
        run: |
          echo "===== error 行 ====="
          grep -E "error:" build.log | head -80 || true
          echo "===== 日志尾部 ====="
          tail -120 build.log || true
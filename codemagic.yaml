# codemagic.yaml —— 备用真编译链路（GitHub macOS runner 在本账号下无法启动）。
#
# GitHub Actions 的 macos-26 runner 一旦触发，job 在 ~2 秒内失败、连 checkout 都不跑
# （疑似账号级 macOS runner 配额 / 分配问题，非代码问题）。改走 Codemagic 免费 M2 档
# 做真编译验证：它支持 Xcode 26 / iOS 26 SDK，而 Sources/Design/Glass.swift 里的
# glassEffect / Glass / GlassEffectContainer 等是 iOS 26 专有 API，必须用此版本才编得过。
#
# 产物为「未签名」的 .app，仅用于验证能否编过；如需真机安装，用 Sideloadly 以
# 自己的 Apple ID 重签即可（与本仓库 CI 的未签名 ipa 后续流程一致）。
#
# 触发：codemagic.io → 用 GitHub 登录 → Add application → 选本仓库 →
#       自动识别本文件 → Start new build → 选 ios-native-build。

workflows:
  ios-native-build:
    name: iOS 原生编译验证
    instance_type: mac_mini_m2
    max_build_duration: 50

    environment:
      xcode: latest   # Codemagic 免费 M2 档的 latest 即 Xcode 26（iOS 26 SDK）

    scripts:
      - name: 安装 / 确认 XcodeGen
        script: |
          which xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen version

      - name: 生成 Xcode 工程
        script: |
          cd ios-native
          xcodegen generate

      - name: 编译并归档（未签名）
        script: |
          set -e
          cd ios-native
          ARCH="$PWD/build/ZSTS.xcarchive"
          rm -rf "$ARCH"
          xcodebuild archive \
            -project ZhangShangTangShi.xcodeproj \
            -scheme ZhangShangTangShi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
          echo "ARCHIVE = $ARCH"

      - name: 打包未签名 IPA（供 Sideloadly 以 Apple ID 重签）
        script: |
          set -e
          ROOT=$(pwd)
          APP=$(find "$ROOT/ios-native/build/ZSTS.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 -type d 2>/dev/null | head -1)
          echo "APP = $APP"
          [ -d "$APP" ] || { echo "找不到 .app（archive 内无产物）"; exit 1; }
          PKG=/tmp/zst_payload
          rm -rf "$PKG" && mkdir -p "$PKG/Payload"
          cp -R "$APP" "$PKG/Payload/"
          ( cd "$PKG" && zip -r -y "$ROOT/ios-native/zstangshi-unsigned.ipa" Payload )
          ls -lh "$ROOT/ios-native/zstangshi-unsigned.ipa"

    artifacts:
      - ios-native/*.ipa


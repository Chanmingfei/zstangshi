# 在 GitHub 的 macOS runner 上编译 ios-native（SwiftUI 原生版）。
#
# 为什么需要它：打 .ipa 必须有 Apple 的 iOS SDK，而 SDK 只能装在 macOS 上。
# 手边没有 Mac 时，这是唯一「全自动拿到 ipa」的途径。
#
# 产物是**未签名** ipa：下载后用 Sideloadly / AltStore 以你自己的 Apple ID 重签安装
# （免费账号 7 天有效期）。
#
# 只做手动触发：ios-native 目前还没有在 Xcode 下编译过，第一次跑可能需要修几个
# 编译期小问题。等确认绿灯之后，再把下面的 push.tag 打开，跟 Android 的 Release 一起出包。

name: Build iOS Native IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '编译配置（Debug / Release）'
        required: false
        default: 'Release'

jobs:
  unsigned-ipa:
    name: 编译未签名 ipa（SwiftUI 原生版）
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios-native
        run: xcodegen generate

      - name: 编译
        working-directory: ios-native
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ZhangShangTangShi.xcodeproj \
            -scheme ZhangShangTangShi \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -40

      - name: 打包成 ipa
        working-directory: ios-native
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/${CONFIG}-iphoneos"
          APP=$(ls -d "$APP_DIR"/*.app | head -1)
          echo "app: $APP"
          rm -rf Payload out.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 去掉本机签名残留，否则 Sideloadly 重签会报 bundle 已被修改
          rm -rf Payload/*.app/_CodeSignature 2>/dev/null || true
          zip -qry out.ipa Payload
          ls -la out.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zstangshi-ios-unsigned
          path: ios-native/out.ipa
          if-no-files-found: error

      - name: 失败时打印编译错误
        if: failure()
        run: |
          grep -E "error:|note: .*error" ios-native/build.log | head -60 || tail -80 ios-native/build.log

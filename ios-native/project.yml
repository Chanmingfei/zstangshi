# zstangshi-ios/project.yml —— 「掌上唐师」iOS 工程描述（XcodeGen）
#
# 用一条命令从本文件生成 Xcode 工程：
#     brew install xcodegen && cd zstangshi-ios && xcodegen generate
#
# 设计要点：
#   · 主 App 与桌面小组件是两个 target，源码目录互相独立、不共享；
#   · PRODUCT_NAME 一律用 ASCII（ZhangShangTangShi）—— 中文可执行文件名会让
#     Sideloadly / AltStore 的重签脚本在没加引号时把路径拆开，导致装不上或装上闪退。
#     中文显示名交给 Info.plist 的 CFBundleDisplayName；
#   · 最低部署 iOS 17.0；iOS 26 专有 API（glassEffect 等）全部用 #available 守卫，
#     但**编译**需要 Xcode 26 / iOS 26 SDK 才能解析这些符号。

name: ZhangShangTangShi

options:
  bundleIdPrefix: com.tstc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 生成 scheme，CI 与本地都能直接 -scheme ZhangShangTangShi
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 保持 Swift 5 并发模型：Swift 6 严格并发会把现有 actor / 闭包写法全报红。
    # 只设 minimal（Xcode 16/26 都认这个值）；
    # 不要设 SWIFT_APPROACHABLE_CONCURRENCY / SWIFT_DEFAULT_ACTOR_ISOLATION ——
    # 这两个是 Xcode 26 才有的设置，旧版本会因「未知 build setting」告警甚至构建失败。
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 关掉位码（未签名 ipa 不需要，且会拖慢构建）
    ENABLE_BITCODE: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:

  # ── 主 App ──────────────────────────────────────────────────────────────
  ZhangShangTangShi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # 网页套壳版：只编译 iOS 原生壳（WKWebView + NativeBridge），
    # 界面全部由 Resources/www/ 里的 HTML/CSS/JS 渲染。
    # 旧的 SwiftUI 原生页面（Sources/Pages、Bus、Net、Data 等）不再编译。
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
      # 注意：www/ **不**由 XcodeGen 管理 —— 它会递归打平子目录导致重名冲突
      # （data/calendar.js 与 pages/calendar.js 都叫 calendar.js）。
      # 改由 codemagic.yaml 打包时用 cp -R 把整个 www 目录塞进 app bundle。
    dependencies:
      - target: TodayWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tstc.zstangshi
        PRODUCT_NAME: ZhangShangTangShi
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "58"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
    scheme:
      testTargets: []
      gatherCoverageData: false

  # ── 桌面小组件（WidgetKit app-extension）───────────────────────────────
  TodayWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tstc.zstangshi.TodayWidget
        PRODUCT_NAME: TodayWidget
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "58"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        ENABLE_PREVIEWS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
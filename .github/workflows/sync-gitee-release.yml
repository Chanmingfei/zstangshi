name: 同步 Release 到 Gitee

# Gitee 的仓库镜像只同步代码（分支 / tag），不会同步 Release 和附件，
# 所以每次在 GitHub 发布后，这里调 Gitee OpenAPI 把发行版补上，
# 让国内用户「检查更新」能走 gitee.com 直连。

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的 tag（多个用空格分隔；留空＝同步全部 Release）
        required: false
        default: ""

concurrency:
  group: gitee-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 海外 runner 到 gitee.com 的链路偏慢，留足时间
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 同步到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_TOKEN。请在 Settings → Secrets and variables → Actions 里添加，值取 Gitee → 设置 → 私人令牌（勾 projects）。"
            exit 1
          fi
          # 脚本本身会对单次请求重试；这里再兜一层整轮重跑。
          # 脚本是幂等的：已经建好的 Release、已上传的附件都会跳过，
          # 所以重跑只会补齐上一轮没传完的部分。
          for attempt in 1 2 3; do
            echo "—— 第 $attempt 轮 ——"
            if python3 -u tools/sync_gitee_release.py $TAG; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::同步失败（已重试 3 轮），请看上面的日志"
          exit 1

name: Runner Probe
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: info
        run: |
          uname -a
          node --version
  mac:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: info
        run: |
          uname -m
          xcodebuild -version

# Codemagic 云构建：没有 Mac 时出未签名 ipa，再用 Sideloadly/AltStore 用免费 Apple ID 重签安装。
#
# 用法：
#   1. codemagic.io 用 GitHub 登录 → Add application → 选 zstangshi 仓库
#   2. 它会自动读到本文件 → Start new build → 选 ios-probe
#   3. 10 分钟左右在 Artifacts 下载 zstangshi-probe-unsigned.ipa
#   4. Windows 上装 Sideloadly（需 iTunes 驱动）→ 拖 ipa → 选你的 Apple ID → Start
#   5. 手机上「设置 → 通用 → VPN与设备管理」信任你的开发者证书，然后打开 App
#
# 免费账号的限制：7 天后失效需重签；每台设备最多 3 个自签 App。
workflows:
  ios-probe:
    name: iOS 探针（未签名 ipa）
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        PROBE_DIR: ios-kmp/probe-ios
    scripts:
      - name: 安装 XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        script: |
          set -e
          cd "$PROBE_DIR"
          xcodegen generate
          echo "--- 工程已生成 ---"
          ls -la

      - name: 编译（不签名）
        script: |
          set -e
          cd "$PROBE_DIR"
          xcodebuild \
            -project ZSTSProbe.xcodeproj \
            -scheme ZSTSProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包未签名 ipa
        script: |
          set -e
          cd "$PROBE_DIR"
          rm -rf out
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/ZSTSProbe.app out/Payload/
          cd out
          zip -qry ../zstangshi-probe-unsigned.ipa Payload
          ls -lh ../zstangshi-probe-unsigned.ipa
          echo "产物：$PROBE_DIR/zstangshi-probe-unsigned.ipa"

    artifacts:
      - ios-kmp/probe-ios/zstangshi-probe-unsigned.ipa
      - ios-kmp/probe-ios/build/Build/Products/Release-iphoneos/ZSTSProbe.app

  # 共享层（KMP）单编：只产出 XCFramework，不编 App。
  # 用途是「证明 commonMain 能被 Kotlin/Native 编译」—— 这一条在 Windows 上永远验不了。
  ios-framework:
    name: iOS 共享层 framework（KMP）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # 官方兼容表：Kotlin 2.4.20–2.4.21 ↔ Xcode 26.4 / Gradle 7.6.3–9.7.0。
      # 不用 latest，避免 runner 升级后 Kotlin/Native 不认新 Xcode。
      xcode: 26.4
      java: 17
      vars:
        KMP_DIR: ios-kmp
        GRADLE_VER: "8.14.4"
    scripts:
      - name: 准备 Gradle
        script: |
          set -e
          if [ ! -x "/tmp/gradle-$GRADLE_VER/bin/gradle" ]; then
            curl -sSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp
          fi
          /tmp/gradle-$GRADLE_VER/bin/gradle --version | sed -n '1,8p'

      - name: 编译 iOS framework（arm64 真机 + 模拟器）
        script: |
          set -e
          cd "$KMP_DIR"
          # 用 link*Framework 而不是 assembleXCFramework：后者要先在构建脚本里
          # 显式声明 XCFramework("Shared") 才会注册任务。当前诉求只是「证明
          # Kotlin/Native 能把 commonMain 编过」，link 任务足够且更直接。
          /tmp/gradle-$GRADLE_VER/bin/gradle --no-daemon --stacktrace \
            :shared:linkDebugFrameworkIosArm64 \
            :shared:linkDebugFrameworkIosSimulatorArm64

      - name: 列出产物
        script: |
          set -e
          find "$KMP_DIR/shared/build/bin" -maxdepth 4 -name "*.framework" -o -maxdepth 4 -name "Shared" -type f | head -20
          du -sh "$KMP_DIR/shared/build/bin"/*/* 2>/dev/null | head -10

    artifacts:
      - ios-kmp/shared/build/bin/**/*.framework

  # 真 App：先编 Kotlin framework，再让 Xcode 链接它。
  # 没有 Mac，所以不用官方那套「在 Xcode 里加 Run Script phase」的 Direct integration，
  # 改成「先构建 framework → XcodeGen 声明依赖」——同样的产物，全流程可脚本化。
  ios-app:
    name: iOS App（接入 Kotlin 共享层）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
      java: 17
      vars:
        KMP_DIR: ios-kmp
        APP_DIR: ios-kmp/app-ios
        GRADLE_VER: "8.14.4"
    scripts:
      - name: 准备 Gradle
        script: |
          set -e
          if [ ! -x "/tmp/gradle-$GRADLE_VER/bin/gradle" ]; then
            curl -sSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip"
            unzip -q /tmp/gradle.zip -d /tmp
          fi
          /tmp/gradle-$GRADLE_VER/bin/gradle --version | sed -n '1,6p'

      - name: 编译 Kotlin framework（release / arm64）
        script: |
          set -e
          cd "$KMP_DIR"
          /tmp/gradle-$GRADLE_VER/bin/gradle --no-daemon --stacktrace \
            :shared:linkReleaseFrameworkIosArm64
          ls -lh shared/build/bin/iosArm64/releaseFramework/

      - name: 安装 XcodeGen 并生成工程
        script: |
          set -e
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd "$APP_DIR"
          xcodegen generate
          ls -la

      - name: 编译 App（不签名）
        script: |
          set -e
          cd "$APP_DIR"
          xcodebuild \
            -project ZSTSApp.xcodeproj \
            -scheme ZSTSApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包未签名 ipa
        script: |
          set -e
          cd "$APP_DIR"
          rm -rf out && mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/ZSTSApp.app out/Payload/
          cd out && zip -qry ../zstangshi-app-unsigned.ipa Payload
          ls -lh ../zstangshi-app-unsigned.ipa

    artifacts:
      - ios-kmp/app-ios/zstangshi-app-unsigned.ipa
